name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker image
        run: docker build -t devops-web-app:ci .

  deploy:
    name: Deploy Application
    needs: build
    runs-on: self-hosted

    env:
      APP_PORT: 8080

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop and remove old container
        run: docker compose down --remove-orphans || true

      - name: Remove old application image
        run: docker image rm devops-web-app:latest-local || true

      - name: Build and start new application
        run: docker compose up -d --build

      - name: Wait for container health
        run: |
          for i in {1..12}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' devops-web-app 2>/dev/null || echo "starting")

            echo "Container health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Deployment successful"
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "Container is unhealthy"
              docker logs devops-web-app
              exit 1
            fi

            sleep 5
          done

          echo "Container did not become healthy"
          docker logs devops-web-app || true
          exit 1

      - name: Verify application
        run: curl -f http://localhost:8080

      - name: Clean unused Docker images
        if: always()
        run: docker image prune -f
