name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: shiprag321/devops-web-app

jobs:
  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:latest .

      - name: Push Docker image
        run: docker push $IMAGE_NAME:latest

  deploy:
    name: Deploy Application
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Stop and remove old container
        run: |
          docker rm -f devops-web-app || true

      - name: Remove old image
        run: |
          docker image rm shiprag321/devops-web-app:latest || true

      - name: Clean unused Docker resources
        run: |
          docker container prune -f
          docker image prune -f
          docker network prune -f

      - name: Pull latest image from Docker Hub
        run: |
          docker pull shiprag321/devops-web-app:latest

      - name: Run new container
        run: |
          docker run -d \
            --name devops-web-app \
            --restart unless-stopped \
            -p 8080:80 \
            shiprag321/devops-web-app:latest

      - name: Wait for container health
        run: |
          for i in {1..12}; do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' devops-web-app 2>/dev/null || echo "starting")
            echo "Container health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Application is healthy"
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              docker logs devops-web-app
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for health check"
          docker logs devops-web-app
          exit 1

      - name: Verify application response
        run: |
          curl --fail http://localhost:8080

      - name: Show final Docker state
        if: always()
        run: |
          docker ps -a
          docker images
